# 백엔드에 넘길 실제 접속 IP. 클라이언트가 보낸 X-Forwarded-For 는 위조할 수 있어 쓰지 않는다.
# 터널(Cloudflare)로 오면 Cloudflare 가 채운 CF-Connecting-IP, 이 PC 에서 바로 오면 접속 주소
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80;
    server_tokens off;
    client_max_body_size 1m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # 열차 조회는 코레일 페이지를 여러 번 넘기므로 넉넉하게
        proxy_read_timeout 120s;
    }

    location /auth/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        try_files $uri /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    # 스크립트는 이 출처의 번들만. antd 는 스타일을 <style> 로 넣어서 style-src 에 'unsafe-inline' 이 필요하다.
    # 이미지는 Discord 아바타(cdn.discordapp.com)만 밖에서 받는다
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.discordapp.com; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
}
